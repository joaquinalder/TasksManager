services:
  # Base de Datos (PostgreSQL)
  postgres_db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: joaquin
      POSTGRES_DB: mi_primer_nest
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD, pg_isready, -h, '127.0.0.1', -U, postgres, -d, mi_primer_nest]
      interval: 2s
      timeout: 3s
      retries: 15

  # Backend (NestJS)
  api:
    build: ./tasks-api
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      DATABASE_URL: "postgresql://postgres:joaquin@postgres_db:5432/mi_primer_nest?schema=public"
      JWT_SECRET: "${JWT_SECRET:?Set JWT_SECRET in the root .env file}"
    depends_on:
      postgres_db:
        condition: service_healthy
    volumes:
      - ./tasks-api:/usr/src/app
      - /usr/src/app/node_modules

  # Frontend (React)
  client:
    build: ./tasks-frontend
    ports:
      - "127.0.0.1:5173:5173"
    environment:
      VITE_API_URL: http://localhost:3000/api/v1/
    depends_on:
      - api
    volumes:
      - ./tasks-frontend:/usr/src/app
      - /usr/src/app/node_modules


volumes:
  postgres_data: # Define el volumen para que la DB no se borre al apagar Docker
